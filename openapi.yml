openapi: 3.0.3
info:
  title: JihyunReminder API
  description: Apple Reminder 웹 버전 REST API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: ReminderList
    description: 리마인더 목록 관리
  - name: Reminder
    description: 리마인더 관리

paths:
  /api/lists:
    get:
      tags:
        - ReminderList
      summary: 전체 목록 조회
      operationId: getAllLists
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReminderListResponse'
              example:
                - id: 1
                  name: 개인
                  color: BLUE
                  icon: 🏠
                  createdAt: 2026-06-12T00:00:00

    post:
      tags:
        - ReminderList
      summary: 목록 생성
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderListRequest'
            example:
              name: 개인
              color: BLUE
              icon: 🏠
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderListResponse'
        '400':
          description: 유효하지 않은 요청 (name 누락 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 목록 이름은 필수입니다

  /api/lists/{id}:
    patch:
      tags:
        - ReminderList
      summary: 목록 수정
      operationId: updateList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderListUpdateRequest'
            example:
              name: 업무
              color: RED
              icon: 💼
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderListResponse'
        '404':
          description: 목록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 목록을 찾을 수 없습니다. id=1

    delete:
      tags:
        - ReminderList
      summary: 목록 삭제
      operationId: deleteList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '204':
          description: 삭제 성공
        '404':
          description: 목록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 목록을 찾을 수 없습니다. id=1

  /api/reminders:
    get:
      tags:
        - Reminder
      summary: 목록별 리마인더 조회
      operationId: getRemindersByListId
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: 조회 성공 (미완료/완료 분리)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderGroupResponse'

    post:
      tags:
        - Reminder
      summary: 리마인더 생성
      operationId: createReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCreateRequest'
            example:
              listId: 1
              title: 장보기
              memo: 우유, 달걀
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '400':
          description: 유효하지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 목록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reminders/{id}:
    patch:
      tags:
        - Reminder
      summary: 리마인더 수정
      operationId: updateReminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '404':
          description: 리마인더 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Reminder
      summary: 리마인더 삭제
      operationId: deleteReminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '404':
          description: 리마인더 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reminders/{id}/complete:
    patch:
      tags:
        - Reminder
      summary: 리마인더 완료 토글
      operationId: toggleReminderComplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 토글 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '404':
          description: 리마인더 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reminders/{id}/flag:
    patch:
      tags:
        - Reminder
      summary: 리마인더 플래그 토글
      operationId: toggleReminderFlag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 토글 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '404':
          description: 리마인더 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reminders/{id}/move:
    patch:
      tags:
        - Reminder
      summary: 리마인더 목록 이동
      operationId: moveReminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderMoveRequest'
            example:
              listId: 2
      responses:
        '200':
          description: 이동 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '404':
          description: 리마인더 또는 목록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ListColor:
      type: string
      enum:
        - RED
        - ORANGE
        - YELLOW
        - GREEN
        - TEAL
        - BLUE
        - INDIGO
        - PURPLE
        - PINK
        - BROWN
      example: BLUE

    ReminderListRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 50
          description: 목록 이름 (필수)
          example: 개인
        color:
          $ref: '#/components/schemas/ListColor'
        icon:
          type: string
          description: 이모지 아이콘 (선택)
          example: 🏠

    ReminderListUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          description: 목록 이름 (선택 - null이면 기존 값 유지)
          example: 업무
        color:
          $ref: '#/components/schemas/ListColor'
        icon:
          type: string
          description: 이모지 아이콘 (선택 - null이면 기존 값 유지)
          example: 💼

    ReminderListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 개인
        color:
          $ref: '#/components/schemas/ListColor'
        icon:
          type: string
          example: 🏠
        createdAt:
          type: string
          format: date-time
          example: 2026-06-12T00:00:00

    Priority:
      type: string
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
      example: NONE

    ReminderMoveRequest:
      type: object
      required:
        - listId
      properties:
        listId:
          type: integer
          format: int64
          example: 2

    ReminderCreateRequest:
      type: object
      required:
        - listId
        - title
      properties:
        listId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          maxLength: 200
          example: 장보기
        memo:
          type: string
          example: 우유, 달걀

    ReminderUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          example: 장보기
        memo:
          type: string
          example: 우유, 달걀
        priority:
          $ref: '#/components/schemas/Priority'
        dueDate:
          type: string
          format: date
          example: 2026-07-01
        dueTime:
          type: string
          format: time
          example: 09:00:00

    SubTaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        reminderId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: 우유 사기
        completed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time

    ReminderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        listId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: 장보기
        memo:
          type: string
          example: 우유, 달걀
        completed:
          type: boolean
          example: false
        completedAt:
          type: string
          format: date-time
          nullable: true
        flagged:
          type: boolean
          example: false
        priority:
          $ref: '#/components/schemas/Priority'
        dueDate:
          type: string
          format: date
          nullable: true
        dueTime:
          type: string
          format: time
          nullable: true
        createdAt:
          type: string
          format: date-time
        subTasks:
          type: array
          items:
            $ref: '#/components/schemas/SubTaskResponse'

    ReminderGroupResponse:
      type: object
      properties:
        incomplete:
          type: array
          items:
            $ref: '#/components/schemas/ReminderResponse'
        completed:
          type: array
          items:
            $ref: '#/components/schemas/ReminderResponse'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 목록을 찾을 수 없습니다. id=1
